<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cua Model Test Form</title><style>
:root{font:16px/1.5 system-ui,-apple-system,sans-serif;color:#202a35;background:#f4f6f8}*{box-sizing:border-box}body{max-width:650px;margin:50px auto;padding:0 20px}main{background:#fff;border:1px solid #dde4ed;border-radius:16px;padding:28px;box-shadow:0 8px 30px #2230440d}h1{font-size:24px;margin:0 0 8px}p{color:#536478}code{background:#eef2f7;padding:2px 5px;border-radius:4px}label{display:block;font-weight:650;margin:20px 0 6px}input{width:100%;padding:11px;border:1px solid #bdcad8;border-radius:8px;font:inherit}button{margin-top:24px;background:#2463eb;color:#fff;border:0;border-radius:8px;padding:10px 15px;cursor:pointer}.note{font-size:13px}
</style></head><body><main><h1>Cua 本地模型测试表单</h1><p>在插件中输入以下资料并扫描：</p><p><code>Company: Northwind Labs</code><br><code>Website: https://example.com</code></p><p>预览应显示两条“模型选择”：Employer name → Northwind Labs；Homepage → https://example.com。这两个字段名与资料名不同，不触发插件的同名规则。</p><form id="demo"><label for="employer">Employer name</label><input id="employer" name="employer" autocomplete="off"><label for="homepage">Homepage</label><input id="homepage" name="homepage" autocomplete="off"><button type="reset">清空字段，重新测试</button></form><p class="note">这是本地静态页面。没有提交按钮，不会发送填写内容。</p></main></body></html>
